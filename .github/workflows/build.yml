name: Build

# Add [release] to a commit message on main to also build the signed app and publish it under Releases.
# The signing key comes from the repository's secrets and is never in the code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Check the study content
        run: |
          for f in content/written/*; do python3 tools/validate.py "$f"; done

      - name: Build the app
        run: ./gradlew --no-daemon assembleDebug

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 7

  phone:
    # Add [phone] to a commit message to run the app on an emulator; results go to the ci-phone branch.
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phone]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app (release settings, test key)
        run: ./gradlew --no-daemon assembleRelease
      - name: Turn on hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Get the version on the phone now
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern "*.apk" --dir old || true
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash ci/upgrade.sh && adb install -r "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)" && bash ci/phone.sh
      - name: Save the results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p phone
          echo "sha=${{ github.sha }} status=${{ job.status }}" > phone/status.txt
          cd phone
          git init -q
          git checkout -q -b ci-phone
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Emulator run"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" ci-phone

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$PASSWORD" ]; then
            echo "Add the SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD secrets first."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          # Builds 1 to 99 were made elsewhere; this carries on above them so updates install over them.
          echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build the signed app
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: jlpt
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish the app file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)" JustLetMePass.apk
          # Only an app signed with your own key installs over the one on your phone.
          signer="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          if "$signer" verify --print-certs JustLetMePass.apk | grep -q "CN=Android Debug"; then
            echo "The app came out signed with the debug key, not yours. Check the two secrets."; exit 1
          fi
          gh release create "v0.1.$BUILD_NUMBER" JustLetMePass.apk \
            --target "${{ github.sha }}" \
            --title "Just Let Me Pass 0.1.$BUILD_NUMBER" \
            --notes "Open this page on your phone, download JustLetMePass.apk and tap it to install or update." \
            --latest
